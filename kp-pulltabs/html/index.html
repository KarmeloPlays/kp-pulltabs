<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pull Tab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="backdrop"></div>

        <div class="machine">
            <button id="close" class="close">×</button>

            <div class="top">
                <div class="eyebrow">LUCKY PULL TABS</div>
                <h1 id="title">Pull Tab</h1>
                <div id="progress">Pull each tab from left to right</div>
            </div>

            <div id="tabArea" class="tab-area"></div>

            <div class="bottom">
                <div class="instruction">
                    <span class="dot"></span>
                    <span id="instructionText">Drag the tab across the line to reveal your prize.</span>
                </div>
                <button id="done" class="done" disabled>FINISH</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
